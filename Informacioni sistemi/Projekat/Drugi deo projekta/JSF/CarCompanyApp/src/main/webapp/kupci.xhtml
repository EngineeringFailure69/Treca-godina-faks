<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns = "http://www.w3.org/1999/xhtml"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://xmlns.jcp.org/jsf/html">


   <h:body>
      <h2>Salon automobila</h2>
      <hr />
         <h3>Kupci</h3>
      
      <h:form>
         <h4>Dodavanje</h4>
      <h:outputLabel value="Ime:"/>
      <div>
      <h:inputText value="#{kupacController.ime}"></h:inputText>
      </div>
      <h:outputLabel value="prezime:"/>
      <div>
      <h:inputText value="#{kupacController.prezime}"></h:inputText>
      </div>
      <div>
      <h:outputLabel value="Adresa:"/>
      </div>
      <div>
      <h:inputText value="#{kupacController.adresa}"></h:inputText>
      </div>
      
      <div>
      <h:outputLabel value="Stanje racuna:"/>
      </div>
      <div>
      <h:inputText value="#{kupacController.racun}"></h:inputText>
      </div>
       
      
      
       
      <h:commandButton value="DodajKupca" action="#{kupacController.dodajKupac(kupacController.ime, kupacController.prezime, kupacController.adresa, kupacController.racun)}"></h:commandButton>
                
      </h:form>

               <h:form>
         <h4>Brisanje</h4>
      <h:outputLabel value="Id za brisanje:"/>
      <div>
      <h:inputText value="#{kupacController.bid}"></h:inputText>
      </div>
     
       
 <h:commandButton value="ObrisiKupca" action="#{kupacController.brisiKupac(kupacController.bid)}"></h:commandButton>
                
      </h:form>
         
         
     <h:form>
     <h4>Azuriranje</h4>
      <h:outputLabel value="Id za azuriranje:"/>
      <div>
      <h:inputText value="#{kupacController.aid}"></h:inputText>
      </div>  
      
      
      <h:outputLabel value="Novo stanje racuna:"/>
      <div>
      <h:inputText value="#{kupacController.racun}"></h:inputText>
      </div>  
      
      
      <h:commandButton value="AzurirajKupca" action="#{kupacController.azurirajKupac(kupacController.aid,kupacController.racun)}"></h:commandButton>
      
      <h:dataTable value="#{kupacController.sviKupci()}" var="k"
    			styleClass="order-table"
    			headerClass="order-table-header"
    			rowClasses="order-table-odd-row,order-table-even-row"
    			style="color:white;font-size:23px;font-weight:bold; margin-top:30px;text-shadow: 1px 1px 2px black, 0 0 15px green, 0 0 5px darkgreen; border:3px solid #a5e840; background-color:rgba(211, 239, 167,0.7);text-align:center; border-spacing: 5px; width:80%; margin-left:10%;">
    	
    		<h:column >
    			<f:facet  name="header">
    				Identifikator
    			</f:facet>
    			<h:outputText value="#{k.id}"/>
    		</h:column>
 
 				<h:column>
    			<f:facet name="header">
    				Ime 
				</f:facet>
    			<h:outputText value="#{k.ime}"/>
    		</h:column>
    		
    			<h:column>
    			<f:facet name="header">
    				Prezime 
				</f:facet>
    			<h:outputText value="#{k.prezime}"/>
    		</h:column>
 
    		<h:column>
    			<f:facet name="header">
    				Adresa
				</f:facet>
    			<h:outputText value="#{k.adresa}"/>
    		</h:column>
    		
    	</h:dataTable>
                
      </h:form>     
         
         
   </h:body>
</html>
