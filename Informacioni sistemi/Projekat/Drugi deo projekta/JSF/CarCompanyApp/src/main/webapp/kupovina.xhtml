<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns = "http://www.w3.org/1999/xhtml"
 	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough"
	xmlns:h="http://xmlns.jcp.org/jsf/html">


   <h:body>
      <h2>Sajt automobila</h2>
      <hr />
         <h3>Kupovina</h3>
      
      <h:form>
         <h4>Kupiti</h4>
      <h:outputLabel value="Id kupca:"/>
      <div>
      <h:inputText value="#{kupovinaController.kupac}"></h:inputText>
      </div>
      <div>
      <h:outputLabel value="Id auta:"/>
      </div>
      <div>
      <h:inputText value="#{kupovinaController.auto}"></h:inputText>
      </div>
      <div>
          <h:outputLabel value="Datum kupovine:"/>
      </div>
      <div>
      <h:inputText value="#{kupovinaController.datum}"></h:inputText>
      </div>
      
 <h:commandButton value="DodajKupovinu" action="#{kupovinaController.dodajKupovinu(kupovinaController.kupac, kupovinaController.auto,kupovinaController.datum)}"></h:commandButton>
                
      </h:form>

	               <h:form>
         <h4>Brisanje</h4>
      <h:outputLabel value="Id za brisanje:"/>
      <div>
      <h:inputText value="#{kupovinaController.bid}"></h:inputText>
      </div>
     
       
 <h:commandButton value="ObrisiKupovinu" action="#{kupovinaController.brisiKupovina(kupovinaController.bid)}"></h:commandButton>
                
      </h:form>
      
      <h:form>
     <h4>Azuriranje</h4>
      <h:outputLabel value="Id za azuriranje:"/>
      <div>
      <h:inputText value="#{kupovinaController.aid}"></h:inputText>
      </div>  
      
      
      <h:outputLabel value="Nov id kupca:"/>
      <div>
      <h:inputText value="#{kupovinaController.kupac}"></h:inputText>
      </div>  
      
      <h:outputLabel value="Nov id auta:"/>
      <div>
      <h:inputText value="#{kupovinaController.auto}"></h:inputText>
      </div>  
      
      <h:outputLabel value="Nov datum:"/>
      <div>
      <h:inputText value="#{kupovinaController.datum}"></h:inputText>
      </div>  
      
      <h:commandButton value="AzurirajKupovina" action="#{kupovinaController.azurirajKupovina(kupovinaController.aid,kupovinaController.kupac, kupovinaController.auto, kupovinaController.datum)}"></h:commandButton>
                
      </h:form> 
	
   </h:body>
</html>
